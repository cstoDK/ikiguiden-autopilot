name: Vis konti for nøglen

on:
  workflow_dispatch:
  push:
    paths:
      - pipeline/list_accounts.py
      - .github/workflows/konti.yml

permissions:
  contents: read

jobs:
  konti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vis konti
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: v23.0
        run: python3 pipeline/list_accounts.py
