name: Tjek nøgletype (midlertidig, udgiver intet)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error, datetime
          t = os.environ.get("T", "").strip()
          kind = "facebook" if t.startswith("EAA") else ("instagram" if t.startswith("IG") else "ukendt")
          print("noegletype:", kind, "laengde:", len(t))
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try: return {"http": e.code, **json.loads(e.read())}
                  except Exception: return {"http": e.code}
          def show(label, d):
              print(label, json.dumps(d, ensure_ascii=False).replace(t, "***")[:900])
          q = urllib.parse.urlencode
          if kind == "facebook":
              d = get("https://graph.facebook.com/v23.0/debug_token?" + q({"input_token": t, "access_token": t})).get("data", {})
              for k in ("type", "application", "app_id", "scopes", "granular_scopes", "is_valid"):
                  print(k + ":", json.dumps(d.get(k), ensure_ascii=False))
              for k in ("expires_at", "data_access_expires_at", "issued_at"):
                  v = d.get(k)
                  print(k + ":", v, datetime.datetime.utcfromtimestamp(v).isoformat() if v else "")
              show("me:", get("https://graph.facebook.com/v23.0/me?" + q({"fields": "id,name", "access_token": t})))
          else:
              show("me:", get("https://graph.instagram.com/v23.0/me?" + q({"fields": "user_id,username,account_type", "access_token": t})))
          PY
