name: Send testen til dem, der kommenterer TEST

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: instagram-comments
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Besvar kommentarer
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: v23.0
        run: python3 pipeline/comments.py
      - name: Besvar kommentarer, engelsk profil
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: v23.0
          AUTOPILOT_PROFILE: en
        run: python3 pipeline/comments.py

      - name: Gem status
        if: always()
        run: |
          git config user.name "ikiguiden-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          if [ -f state/dm.json ]; then git add state/dm.json; fi
          if [ -f profiles/en/state/dm.json ]; then git add profiles/en/state/dm.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Opdater status for beskeder"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push
          fi
